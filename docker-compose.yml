version: '3.8'

services:
  gateway:
    build: .
    container_name: bhumijo-gateway
    ports:
      - "5454:5454"
    environment:
      RELAY_IP: 192.168.1.100
      RELAY_PASSWORD: 12345
      SERVER_URL: http://localhost:8000
      DEVICE_TOKEN: gateway-device-token
      GATEWAY_PORT: 5454
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5454/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  logs:
    driver: local