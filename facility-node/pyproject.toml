[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "facility-node"
version = "0.1.0"
description = "Offline-first facility controller for Raspberry Pi 5"
requires-python = ">=3.9"
dependencies = [
    "flask==2.3.3",
    "requests==2.31.0",
    "smbus2==0.4.3",
    "qrcode==7.4.2",
    "pypng==0.20220715.0",
]